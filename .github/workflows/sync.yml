name: Upstream Sync & Deploy EdgeTunnel

permissions:
  contents: write

on:
  schedule:
    # 每月 1 日和 15 日 00:00 UTC 检查一次 CM
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync CM and deploy existing EdgeTunnel Worker
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. 获取当前 Fork
      # ============================================================
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      # ============================================================
      # 2. 获取 CM upstream，并检查是否真的有代码更新
      # ============================================================
      - name: Check upstream for updates
        id: upstream
        shell: bash
        run: |
          set -e

          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream main

          echo "Checking CM upstream changes..."

          # 我们自己的 Workflow 不参与更新判断。
          #
          # 原因：
          # .github/workflows/sync.yml 是我们自己的自动化文件，
          # 不能因为它和 CM 不一样，就一直认为 CM 有更新。
          if git diff --quiet HEAD upstream/main -- \
              . \
              ':(exclude).github/workflows/sync.yml'; then

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No EdgeTunnel code changes detected."

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New EdgeTunnel changes detected from CM."

          fi

      # ============================================================
      # 3. 没有 CM 更新，直接结束
      # ============================================================
      - name: No upstream changes
        if: steps.upstream.outputs.changed == 'false'
        run: |
          echo "CM has no new EdgeTunnel code changes."
          echo "Nothing to sync."
          echo "Nothing to deploy."

      # ============================================================
      # 4. 保存我们自己的 sync.yml
      # ============================================================
      - name: Backup local workflow
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/local-workflow

          cp .github/workflows/sync.yml \
             /tmp/local-workflow/sync.yml

          echo "Local sync workflow backed up."

      # ============================================================
      # 5. 同步 CM 最新代码
      # ============================================================
      - name: Sync CM upstream
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          echo "Syncing EdgeTunnel with cmliu/edgetunnel..."

          # 先让仓库完整对齐 CM。
          git reset --hard upstream/main

          # 恢复我们自己的自动部署 Workflow。
          mkdir -p .github/workflows

          cp /tmp/local-workflow/sync.yml \
             .github/workflows/sync.yml

          echo "CM source synchronized."
          echo "Local deployment workflow preserved."

      # ============================================================
      # 6. 提交同步结果
      # ============================================================
      - name: Commit synced EdgeTunnel
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git add -A

          # 检查是否真的存在需要提交的变化。
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Sync latest EdgeTunnel from CM"

          echo "Sync commit created."

      # ============================================================
      # 7. Push 回自己的 GitHub Fork
      # ============================================================
      - name: Push synced EdgeTunnel
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          git push origin main

          echo "Push completed successfully."

      # ============================================================
      # 8. 检查生产部署配置
      # ============================================================
      - name: Verify production deployment configuration
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          set -e

          echo "Checking EdgeTunnel production configuration..."

          # ----------------------------------------------------------
          # 必须存在 Worker 主文件
          # ----------------------------------------------------------
          if [ ! -f "_worker.js" ]; then
            echo "[ERROR] _worker.js not found."
            exit 1
          fi

          # ----------------------------------------------------------
          # 必须存在 Wrangler 配置
          # ----------------------------------------------------------
          if [ ! -f "wrangler.toml" ]; then
            echo "[ERROR] wrangler.toml not found."
            exit 1
          fi

          # ----------------------------------------------------------
          # 必须部署到我们已经存在的 Worker
          # ----------------------------------------------------------
          if ! grep -Eq \
            '^[[:space:]]*name[[:space:]]*=[[:space:]]*"v20251104"[[:space:]]*$' \
            wrangler.toml; then

            echo "[ERROR] Worker name is not v20251104."
            echo "[ERROR] Deployment stopped for safety."
            exit 1
          fi

          echo "Worker name check passed: v20251104"

          # ----------------------------------------------------------
          # 创建临时生产 Wrangler 配置
          # ----------------------------------------------------------
          cp wrangler.toml wrangler.production.toml

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("wrangler.production.toml")
          text = path.read_text()

          # 删除已有的 kv_namespaces 区块。
          text = re.sub(
              r'(?ms)^\[\[kv_namespaces\]\]\s*.*?(?=^\[\[|\Z)',
              '',
              text
          )

          # 删除可能存在的 inline kv_namespaces 配置。
          text = re.sub(
              r'(?ms)^[ \t]*kv_namespaces[ \t]*=[ \t]*\[.*?\]\s*$',
              '',
              text
          )

          text = text.rstrip() + """

          [[kv_namespaces]]
          binding = "KV"
          id = "5f8641c6c7824c269e8473a962083248"
          """

          path.write_text(text)
          PY

          echo "Production Wrangler configuration created."

          # ----------------------------------------------------------
          # 最终安全检查
          # ----------------------------------------------------------
          if ! grep -q \
            'binding = "KV"' \
            wrangler.production.toml; then

            echo "[ERROR] KV binding is missing."
            exit 1
          fi

          if ! grep -q \
            'id = "5f8641c6c7824c269e8473a962083248"' \
            wrangler.production.toml; then

            echo "[ERROR] Production KV namespace ID is incorrect."
            exit 1
          fi

          echo "KV binding check passed."
          echo "Production configuration is safe to deploy."

      # ============================================================
      # 9. 部署到已经存在的 EdgeTunnel Worker
      # ============================================================
      - name: Deploy existing EdgeTunnel Worker
        if: steps.upstream.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.toml

      # ============================================================
      # 10. 删除临时生产配置
      # ============================================================
      - name: Remove temporary production configuration
        if: always() && steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          rm -f wrangler.production.toml

          echo "Temporary production configuration removed."
