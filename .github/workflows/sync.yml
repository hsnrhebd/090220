name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    # 每月1号 UTC 14:37（北京时间 22:37）
    - cron: "37 14 1 * *"
  workflow_dispatch:

jobs:
  sync_and_deploy:
    name: Sync from upstream + Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if upstream has new commits
        id: check
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git || true
          git fetch upstream main

          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "has_update=false" >> $GITHUB_OUTPUT
            echo "✅ 上游没有新提交，跳过同步和部署"
          else
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "🔄 检测到上游有新提交，开始同步"
          fi

      - name: Backup important local files
        if: steps.check.outputs.has_update == 'true'
        run: |
          # 备份 wrangler.toml（保留 KV 绑定）
          cp wrangler.toml /tmp/my_wrangler.toml
          # 备份我们自己的工作流文件
          cp .github/workflows/sync.yml /tmp/my_sync.yml
          echo "✅ 已备份 wrangler.toml 和 sync.yml"

      - name: Sync upstream (force + keep local files)
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "GH Action - Upstream Sync"
          git config user.email "action@github.com"

          # 强制对齐上游最新代码
          git reset --hard upstream/main

          # 恢复我们需要保留的文件
          cp /tmp/my_wrangler.toml wrangler.toml
          mkdir -p .github/workflows
          cp /tmp/my_sync.yml .github/workflows/sync.yml

          git add wrangler.toml .github/workflows/sync.yml
          git commit -m "chore: sync upstream + keep local wrangler.toml and sync.yml" || echo "没有需要额外提交的内容"
          git push origin main --force

      - name: Deploy to Cloudflare Workers (force)
        if: steps.check.outputs.has_update == 'true'
        uses: cloudflare/wrangler-action@v3.14
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
